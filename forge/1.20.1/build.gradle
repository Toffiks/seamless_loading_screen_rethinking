buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.42'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                seamless_loading_screen {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'seamless_loading_screen.refmap.json'
    config 'seamless_loading_screen-common.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation fg.deobf("dev.isxander:yet-another-config-lib:${project.yacl_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            mod_version: project.mod_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range,
            yacl_version_range: project.yacl_version_range
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-classfile']
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs': 'seamless_loading_screen-common.mixins.json',
                'Implementation-Title': 'Seamless Loading Screen Rethinking',
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor': 'Minenash, Toffiks'
        ])
    }
    finalizedBy 'reobfJar'
}

java {
    withSourcesJar()
}
